version: 1
updated: 2026-08-11
north_star:
  commercial: Mind-Reply
  intelligence_command: A11-K
  development_estate: angellllkr-eng
principles:
  - evidence_before_claims
  - no_secret_values_in_git
  - no_blind_merges_or_deletes
  - production_mutations_require_authorization
  - every_change_has_a_receipt
  - unknown_is_not_healthy
agents:
  cartographer:
    purpose: inventory repositories, dependencies, deployments and domains
    cadence: daily
    authority: READ
  security-analyst:
    purpose: scan tracked trees and workflow configuration for secret exposure and unsafe boundaries
    cadence: daily
    authority: READ
  ci-guardian:
    purpose: observe CI failures and open bounded repair work
    cadence: hourly
    authority: LOW
  reality-gate:
    purpose: verify production targets and critical customer routes
    cadence: hourly
    authority: READ
  release-analyst:
    purpose: validate release receipts and promotion prerequisites
    cadence: per-release
    authority: READ
  dependency-analyst:
    purpose: detect repository duplication, dependency drift and stale components
    cadence: daily
    authority: READ
  commercial-journey:
    purpose: verify visitor-to-outcome customer path
    cadence: hourly
    authority: READ
  evidence-recorder:
    purpose: normalize safe evidence and release receipts
    cadence: per-operation
    authority: LOW
  recovery-analyst:
    purpose: propose bounded recovery actions when verified failures occur
    cadence: event-driven
    authority: LOW
  owner-approval-gate:
    purpose: stop high-risk or critical mutations pending explicit owner approval
    cadence: event-driven
    authority: CRITICAL
safety:
  forbidden_without_owner_approval:
    - secret_rotation
    - dns_mutation
    - production_deploy
    - production_rollback
    - billing_change
    - repository_delete
    - repository_transfer
    - organization_permission_change
    - destructive_database_change
  never:
    - print_secret_values
    - copy_production_credentials_to_logs
    - auto_merge_security_sensitive_changes
    - infer_production_health_from_repository_state
