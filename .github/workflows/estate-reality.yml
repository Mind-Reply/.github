name: Estate Reality Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

jobs:
  reality:
    if: ${{ vars.ESTATE_AUTOMATION_ENABLED == 'true' && vars.ESTATE_TARGETS != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe configured targets
        env:
          ESTATE_TARGETS: ${{ vars.ESTATE_TARGETS }}
        run: |
          set -euo pipefail
          mkdir -p docs/estate/runs
          python - <<'PY'
          import json, os, urllib.request, datetime
          targets=json.loads(os.environ['ESTATE_TARGETS'])
          results=[]
          for target in targets:
            url=target['url']
            item={'target':url,'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'github-actions-reality-gate'}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'estate-reality-gate/1.0'})
              with urllib.request.urlopen(req,timeout=10) as r:
                item.update({'http_status':r.status,'state':'VERIFIED' if 200 <= r.status < 400 else 'BLOCKED'})
            except Exception as e:
              item.update({'state':'DOWN','error_type':type(e).__name__})
            results.append(item)
          open('docs/estate/runs/reality-latest.json','w').write(json.dumps({'results':results},indent=2))
          PY
      - name: Commit reality receipt
        run: |
          git config user.name 'estate-automation'
          git config user.email 'estate-automation@users.noreply.github.com'
          git add docs/estate/runs/reality-latest.json
          git diff --cached --quiet || git commit -m 'chore: refresh estate reality evidence'
          git push
